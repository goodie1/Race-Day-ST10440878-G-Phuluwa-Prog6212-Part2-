name: RaceDay API Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build API and Run Unit Tests
    runs-on:  windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check .NET installation
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore RaceDay_API.slnx

      - name: Build solution
        run: dotnet build RaceDay_API.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay_API.slnx --configuration Release --no-build --no-restore
